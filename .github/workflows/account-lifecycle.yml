name: Account lifecycle UI

on:
  pull_request:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Lint changed application and browser test code
        run: npx eslint src/api/account.api.ts src/App.tsx src/utils/storage.ts src/pages/DeleteAccountPage.tsx src/pages/AccountDeletedPage.tsx src/pages/HelpPage.tsx src/pages/AccountPage.tsx src/pages/ForgotPasswordPage.tsx src/pages/ResetPasswordPage.tsx e2e/account-deletion.spec.ts playwright.config.ts
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: account-lifecycle-browser-failures
          path: |
            test-results/
            playwright-report/
          retention-days: 7
