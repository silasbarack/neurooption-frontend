name: Frontend verification
on:
  push:
    branches: [main, codex/neurooption-responsive-redesign]
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: frontend-qa-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Existing ESLint baseline
        continue-on-error: true
        run: npm run lint
      - name: TypeScript
        run: npx tsc -b
      - name: Production build
        run: npm run build
