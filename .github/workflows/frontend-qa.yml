name: Frontend verification
on:
  push:
    branches: [main, codex/neurooption-responsive-redesign]
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: frontend-qa-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npx tsc -b
      - run: npm run build
      - run: npm install --no-save --package-lock=false playwright@1.58.2
      - run: npx playwright install --with-deps chromium
      - name: Browser regressions
        run: |
          npm run preview -- --host 127.0.0.1 > /tmp/neurooption-preview.log 2>&1 &
          node -e "const t=setInterval(async()=>{try{const r=await fetch('http://127.0.0.1:4173');if(r.ok){clearInterval(t);process.exit(0)}}catch{}},250);setTimeout(()=>process.exit(1),30000)"
          node scripts/interaction-regression.mjs
