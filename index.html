<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="32x32" href="/brand/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="64x64" href="/brand/favicon-64.png" />
    <link rel="apple-touch-icon" href="/brand/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <link rel="preload" as="image" type="image/webp" href="/brand/neurooption-logo-480.webp" />
    <meta name="description" content="NeuroOption: OTC trading on forex, crypto, stocks, indices and commodities, with live candlestick charts and a demo account." />
    <meta property="og:title" content="NeuroOption" />
    <meta property="og:description" content="Trade with clarity. React in real time." />
    <meta property="og:image" content="/brand/icon-512.png" />
    <meta property="og:type" content="website" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <title>NeuroOption</title>
    <style>
      #app-splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 26px;
        padding: 24px;
        background: #ffffff;
        font-family: "Noto Sans", Arial, sans-serif;
        transition: opacity 0.18s ease, visibility 0.18s ease;
      }
      #app-splash.is-hidden {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }
      .app-splash-logo {
        width: min(260px, 64vw);
        height: auto;
        animation: app-splash-in 0.7s cubic-bezier(0.2, 0.8, 0.2, 1) both,
          app-splash-breathe 2.4s ease-in-out 0.7s infinite;
      }
      .app-splash-track {
        width: min(220px, 56vw);
        height: 4px;
        border-radius: 999px;
        background: #eaf2f7;
        overflow: hidden;
      }
      .app-splash-bar {
        width: 100%;
        height: 100%;
        border-radius: inherit;
        background: linear-gradient(90deg, #0d315e, #0879ad, #17adb4);
        transform-origin: left center;
        transform: scaleX(0.04);
        animation: app-splash-progress 2.6s cubic-bezier(0.1, 0.7, 0.3, 1) forwards;
        transition: transform 0.35s ease;
      }
      #app-splash.is-ready .app-splash-bar {
        animation: none;
        transform: scaleX(1);
      }
      .app-splash-text {
        margin: 0;
        color: #526579;
        font-size: 13px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        animation: app-splash-in 0.7s ease 0.25s both;
      }
      @keyframes app-splash-in {
        from { opacity: 0; transform: translateY(10px) scale(0.98); }
        to { opacity: 1; transform: none; }
      }
      @keyframes app-splash-breathe {
        0%, 100% { transform: scale(1); }
        50% { transform: scale(1.025); }
      }
      @keyframes app-splash-progress {
        0% { transform: scaleX(0.04); }
        60% { transform: scaleX(0.7); }
        100% { transform: scaleX(0.88); }
      }
      @media (prefers-reduced-motion: reduce) {
        .app-splash-logo, .app-splash-text { animation: none; }
        .app-splash-bar { animation: none; transform: scaleX(0.6); }
      }
    </style>
  </head>
  <body>
    <div id="app-splash" role="status" aria-live="polite" aria-label="Loading NeuroOption">
      <img class="app-splash-logo" src="/brand/neurooption-logo-480.webp" width="1019" height="760" alt="NeuroOption" />
      <div class="app-splash-track"><div class="app-splash-bar"></div></div>
      <p class="app-splash-text">Preparing your trading workspace</p>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
