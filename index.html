<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="preload" as="image" href="/neurooption-logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ffffff" />
    <title>NeuroOption</title>
    <style>
      #app-splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 26px;
        padding: 24px;
        background:
          radial-gradient(circle at 50% 38%, rgba(19, 185, 178, 0.10), transparent 46%),
          linear-gradient(180deg, #f8fbfe 0%, #edf4f9 100%);
        font-family: Roboto, Arial, Helvetica, sans-serif;
        transition: opacity 0.45s ease, visibility 0.45s ease;
      }
      #app-splash.is-hidden {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }
      .app-splash-logo {
        width: min(300px, 72vw);
        height: auto;
        animation: app-splash-in 0.7s cubic-bezier(0.2, 0.8, 0.2, 1) both,
          app-splash-breathe 2.4s ease-in-out 0.7s infinite;
      }
      .app-splash-track {
        width: min(220px, 56vw);
        height: 4px;
        border-radius: 999px;
        background: rgba(17, 103, 202, 0.12);
        overflow: hidden;
      }
      .app-splash-bar {
        width: 100%;
        height: 100%;
        border-radius: inherit;
        background: linear-gradient(90deg, #13b9b2, #1167ca);
        transform-origin: left center;
        transform: scaleX(0.04);
        animation: app-splash-progress 2.6s cubic-bezier(0.1, 0.7, 0.3, 1) forwards;
        transition: transform 0.35s ease;
      }
      #app-splash.is-ready .app-splash-bar {
        animation: none;
        transform: scaleX(1);
      }
      .app-splash-text {
        margin: 0;
        color: #6f8194;
        font-size: 13px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        animation: app-splash-in 0.7s ease 0.25s both;
      }
      @keyframes app-splash-in {
        from { opacity: 0; transform: translateY(10px) scale(0.98); }
        to { opacity: 1; transform: none; }
      }
      @keyframes app-splash-breathe {
        0%, 100% { transform: scale(1); }
        50% { transform: scale(1.025); }
      }
      @keyframes app-splash-progress {
        0% { transform: scaleX(0.04); }
        60% { transform: scaleX(0.7); }
        100% { transform: scaleX(0.88); }
      }
      @media (prefers-reduced-motion: reduce) {
        .app-splash-logo, .app-splash-text { animation: none; }
        .app-splash-bar { animation: none; transform: scaleX(0.6); }
      }
    </style>
  </head>
  <body>
    <div id="app-splash" role="status" aria-live="polite" aria-label="Loading NeuroOption">
      <img class="app-splash-logo" src="/neurooption-logo.png" alt="NeuroOption" />
      <div class="app-splash-track"><div class="app-splash-bar"></div></div>
      <p class="app-splash-text">Preparing your trading workspace</p>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
